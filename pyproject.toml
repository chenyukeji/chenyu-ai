[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-product-os"
version = "0.1.0"
description = "Amazon product discovery, development decision, and listing launch workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
amazon-os = "amazon_product_os.cli:main"

[tool.setuptools.packages.find]
include = ["amazon_product_os*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
